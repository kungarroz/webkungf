<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- 1. Fondo: Negro puro con radio de 24px (estándar iOS/App) -->
  <rect width="128" height="128" rx="24" fill="#050505"/>
  
  <!-- 2. Letra K: -->
  <!-- font-size="84": Tamaño equilibrado (aprox 65% del alto total) -->
  <!-- dominant-baseline="central": Alinea el centro vertical exacto de la fuente con y="50%" -->
  <!-- text-anchor="middle": Alinea el centro horizontal exacto con x="50%" -->
  <text 
    x="50%" 
    y="50%" 
    dominant-baseline="central" 
    text-anchor="middle" 
    font-family="'Times New Roman', Times, serif" 
    font-weight="bold" 
    font-size="84" 
    fill="#e5e5e5"
  >
    K
  </text>
  
  <!-- 3. Punto de Acento: -->
  <!-- cx="104" cy="104": Posicionado en el cuadrante inferior derecho con margen de seguridad -->
  <!-- El radio r="10" + posición 104 deja espacio suficiente respecto a la letra -->
  <circle cx="104" cy="104" r="10" fill="#dc2626" stroke="#050505" stroke-width="4"/>
</svg>